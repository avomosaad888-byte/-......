.sh-i i{font-style:normal;min-width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--track);font-size:12px;font-weight:800}
.sh-i.on{background:var(--panel);border:1px solid var(--acc)}
.sh-i.on i{background:var(--acc);color:#1d0c03}
.edge,.given{stroke:var(--ln-edge);stroke-width:2.4;fill:none;stroke-linejoin:round}
.hl{stroke:var(--ln-hl);stroke-width:3.6;fill:none}
.tick{stroke:var(--ln-hl);stroke-width:2;fill:none}
.proj{stroke:var(--ln-proj);stroke-width:1.1;fill:none}
.mit{stroke:var(--ln-mit);stroke-width:2.2;fill:none}
.con{stroke:var(--ln-con);stroke-width:1.2;fill:none}
.con2{stroke:var(--ln-con2);stroke-width:1.4;fill:none}
.hid{stroke:var(--ln-hid);stroke-width:2.6;fill:none}
.ax{stroke:var(--ln-ax);stroke-width:2;fill:none}
.dot{fill:var(--dot);stroke:var(--stageBg);stroke-width:1.5}
.s1{fill:var(--s1);stroke:var(--ss1);stroke-width:3.2;stroke-linejoin:round}
.s2{fill:var(--s2);stroke:var(--ss2);stroke-width:3.2;stroke-linejoin:round}
.s3{fill:var(--s3);stroke:var(--ss3);stroke-width:3.6;stroke-linejoin:round}
.ft{fill:var(--f-ft);stroke:var(--ln-edge);stroke-width:2;stroke-linejoin:round}
.fa{fill:var(--f-fa);stroke:var(--ln-edge);stroke-width:2;stroke-linejoin:round}
.fl{fill:var(--f-fl);stroke:var(--ln-edge);stroke-width:2;stroke-linejoin:round}
text{fill:var(--txt);font:700 13px 'Cairo',Tahoma,sans-serif}
.dimlbl{fill:var(--ink);font-size:12.5px;paint-order:stroke;stroke:var(--stageBg);stroke-width:4px;stroke-linejoin:round}
.drawing{filter:drop-shadow(0 0 5px var(--acc))}
.pen{fill:var(--acc2);stroke:#fff;stroke-width:1.6;filter:drop-shadow(0 0 7px var(--acc))}
@media (min-width:760px){.app{padding-bottom:230px}.card p{font-size:15.5px}}
@media (prefers-reduced-motion:reduce){.embers i{animation:none}}

      <div class="pres-meta"><span class="badge" id="presStep"></span><span class="phase" id="presPhase"></span><button class="ico" id="presClose" aria-label="إغلاق شاشة العرض" title="إغلاق" style="width:40px;height:40px">×</button></div>

      <input class="pres-scrub" type="range" id="presScrub" min="0" max="1000" value="0" aria-label="تقدم الرسم المتحرك">
    </div>

<script>
/* ===== دوال الإسقاط (الخانات اللي ممكن تتعدل) ===== */
const S=4;let K=4.5;
const F=(x,z)=>[40+S*x,200-S*z];            // المسقط الأمامي
const T=(x,y)=>[40+S*x,250+S*(36-y)];       // المسقط الأفقي (تحت الأمامي)
const D=(y,z)=>[520+S*(36-y),200-S*z];      // المسقط الجانبي (يمين الأمامي)
const I=(x,y,z)=>{const r=[230+(x-y)*.866*K,480-(x+y)*.5*K-z*K];r.w=[x,y,z];return r}; // إيزومتريك

/* ===== مخزن العناصر والخطوات ===== */
let E=[],ST=[];
function step(v,txt,d){ST.push({v,txt,d,start:0});return ST.length-1}
function add(st,type,pts,cls,txt,dim){E.push({st,type,pts,cls,txt,dim:dim==null?99:dim})}
function box(st,x0,x1,y0,y1,z0,z1,cls,dim){
  const P=(x,y,z)=>I(x,y,z);
  [[[x0,y0,z0],[x1,y0,z0]],[[x0,y1,z0],[x1,y1,z0]],[[x0,y0,z1],[x1,y0,z1]],[[x0,y1,z1],[x1,y1,z1]],
   [[x0,y0,z0],[x0,y1,z0]],[[x1,y0,z0],[x1,y1,z0]],[[x0,y0,z1],[x0,y1,z1]],[[x1,y0,z1],[x1,y1,z1]],
   [[x0,y0,z0],[x0,y0,z1]],[[x1,y0,z0],[x1,y0,z1]],[[x0,y1,z0],[x0,y1,z1]],[[x1,y1,z0],[x1,y1,z1]]]
  .forEach(e=>add(st,'l',[P(...e[0]),P(...e[1])],cls,null,dim));
}

/* ===== المسائل الجديدة (الدفعة 1: مسألة 1 و 2) ===== */
const NP=6;
/* خطوات المسقط الثالث المشتركة: الأبعاد - خطوط الارتفاع - خط 45° */
function common(c){
  const {F,T,W,YD,H,zs,ys,xs}=c,r=40+S*W;let s;
  s=step('A','<b>الأبعاد المشتركة:</b> الارتفاع <b>'+H+'</b> موجود في الأمامي وهو نفسه ارتفاع الجانبي. والعمق <b>'+YD+'</b> موجود في الأفقي وهو نفسه عرض الجانبي.',3000);
  add(s,'l',[F(W,0),F(W,H)],'hl',null,8);add(s,'t',[[r+8,200-S*H/2]],'','الارتفاع '+H,8);
  add(s,'l',[T(W,0),T(W,YD)],'hl',null,8);add(s,'t',[[r+8,250+S*YD/2]],'','العمق '+YD,8);
  s=step('A','<b>خطوط الارتفاع:</b> نمد خطوط أفقية من مستويات الأمامي ('+zs.map(z=>+z.toFixed(1)).join(' و')+') ناحية اليمين، لأن الارتفاع ثابت في كل المساقط.',3200);
  zs.forEach(z=>add(s,'l',[F(W,z),[xs+S*YD+12,200-S*z]],'proj',null,8));
  s=step('A','<b>خط 45°:</b> العمق بييجي من الأفقي. نرسم خط 45° (الأحمر) وننقل عليه الأعماق ('+ys.join(' و')+') لفوق، فالعمق في الأفقي بيتحول لعرض في الجانبي.',4200);
  add(s,'l',[[xs,250],[xs+S*YD,250+S*YD]],'mit',null,8);
  ys.forEach(y=>{const p=250+S*(YD-y);add(s,'l',[[r,p],[xs+p-250,p],[xs+p-250,200-S*H-6]],'proj',null,8)});
}
/* رسم الأسطح الإيزومترية بترتيب (الأبعد الأول) */
function faces(s,fc){const k=a=>a.reduce((m,p)=>m+p[0]+p[1]-p[2],0)/a.length;
  fc.map(f=>[f[0].map(p=>I(...p)),f[1],f[2]!==undefined?f[2]:k(f[0])]).sort((a,b)=>b[2]-a[2]).forEach(f=>add(s,'p',f[0],f[1]))}
function axes(L){let s=step('B','<b>المحاور الإيزومترية:</b> Z رأسي، و X وY بزاوية 30° عن الأفقي. كل الأطوال على المحاور بتتقاس بمقياس حقيقي.',3000);
  [['X',[L[0],0,0],6,0],['Y',[0,L[1],0],-16,0],['Z',[0,0,L[2]],-5,-8]].forEach(a=>{add(s,'l',[I(0,0,0),I(...a[1])],'ax');const q=I(...a[1]);add(s,'t',[[q[0]+a[2],q[1]+a[3]]],'',a[0])})}
function dims(W,Dp,H){let s=step('B','<b>نقل الأبعاد:</b> الطول <b>'+W+'</b> من الأمامي، العمق <b>'+Dp+'</b> من الأفقي، الارتفاع <b>'+H+'</b> من الأمامي.',3200);
  [[[W,0,0],W,8,14],[[0,Dp,0],Dp,-26,8],[[0,0,H],H,-28,0]].forEach(a=>{add(s,'l',[I(0,0,0),I(...a[0])],'hl',null,11);const q=I(...a[0]);add(s,'t',[[q[0]+a[2],q[1]+a[3]]],'',a[1],11)})}

/* ===== المسألة 1 =====
   لوح: x0..74 , y0..27 , z0..12  + شطفة 9×8 في الركنين الأماميين
   بلوك أوسط: x19..55 , y0..27 , z0..26
   شق مخفي من الخلف: x29..45 , y16..27 , z0..26  (عرض 16 وعمق 11) */
function problem1(){
  E=[];ST=[];K=4.5;
  const W=74,YD=27,H=26,xs=40+S*W+120;
  const F=(x,z)=>[40+S*x,200-S*z],T=(x,y)=>[40+S*x,250+S*(YD-y)],D=(y,z)=>[xs+S*(YD-y),200-S*z];
  let s=step('A','<b>المعطى:</b> المسقط الأمامي (فوق) والأفقي (تحت). المطلوب المسقط <b>الجانبي من اليسار</b> وهيتحط على يمين الأمامي. الخطين المتقطعين في الأمامي هم حواف الشق من ورا.',3200);
  add(s,'p',[F(0,0),F(74,0),F(74,12),F(55,12),F(55,26),F(19,26),F(19,12),F(0,12)],'given');
  add(s,'l',[F(9,0),F(9,12)],'given');add(s,'l',[F(65,0),F(65,12)],'given');
  add(s,'l',[F(29,0),F(29,26)],'hid');add(s,'l',[F(45,0),F(45,26)],'hid');
  add(s,'p',[T(0,8),T(9,0),T(65,0),T(74,8),T(74,27),T(45,27),T(45,16),T(29,16),T(29,27),T(0,27)],'given');
  add(s,'l',[T(19,0),T(19,27)],'given');add(s,'l',[T(55,0),T(55,27)],'given');
  add(s,'t',[[40,218]],'','الأمامي');add(s,'t',[[40,380]],'','الأفقي');add(s,'t',[[xs,218]],'','الجانبي (المطلوب)');
  common({F,T,W,YD,H,zs:[0,12,26],ys:[0,8,16,27],xs});
  s=step('A','<b>الحدود الخارجية:</b> مستطيل 27×26، لأن البلوك الأوسط (ارتفاع 26) عمقه 27 كامل فهو اللي بيحدد الشكل الخارجي.',2800);
  add(s,'p',[D(0,0),D(27,0),D(27,26),D(0,26)],'s3');
  s=step('A','<b>الخطوط الداخلية الظاهرة:</b> خط الارتفاع 12 على العرض كله (سطح اللوح)، وخط رأسي عند عمق 8 هو حافة الشطفة. التظليل: الأفتح = الأقرب ليك.',3400);
  add(s,'p',[D(8,0),D(0,0),D(0,12),D(8,12)],'s2');add(s,'p',[D(27,0),D(8,0),D(8,12),D(27,12)],'s1');add(s,'p',[D(27,12),D(0,12),D(0,26),D(27,26)],'s2');
  s=step('A','<b>الخطوط المخفية:</b> الشق بيبدأ من الخلف عند عمق 16 ونازل بكل الارتفاع، وهو مستخبي ورا الوش الجانبي، فبنرسم خط <b>متقطع</b> رأسي عند عمق 16.',3000);
  add(s,'l',[D(16,0),D(16,26)],'hid');
  s=step('A','<b>المراجعة:</b> الارتفاعات 26 و12 مطابقة للأمامي، والأعماق 27 و8 و16 مطابقة للأفقي. المسقط الجانبي جاهز ✔',3000);
  add(s,'t',[[xs+30,190]],'','✔ مطابق');
  axes([90,40,34]);dims(74,27,26);
  s=step('B','<b>الصندوق الأساسي</b> 74×27×26 بخطوط إنشاء رفيعة (خضراء). المجسم كله جواه.',3600);box(s,0,74,0,27,0,26,'con',14);
  s=step('B','<b>اللوح:</b> كتلة 74×27×12 بخطوط صفراء.',3200);box(s,0,74,0,27,0,12,'con2',14);
  s=step('B','<b>البلوك الأوسط:</b> من x=19 لـ55 (عرض 36) بعمق 27 كامل وارتفاع لحد 26.',3200);box(s,19,55,0,27,12,26,'con2',14);
  s=step('B','<b>الشق والشطفتين:</b> الشق 16 عرض و11 عمق من الخلف، والشطفة 9×8 في كل ركن أمامي.',3600);
  add(s,'l',[I(29,27,26),I(29,16,26)],'hl');add(s,'l',[I(29,16,26),I(45,16,26)],'hl');add(s,'l',[I(45,16,26),I(45,27,26)],'hl');
  [0,12].forEach(z=>{add(s,'l',[I(0,8,z),I(9,0,z)],'hl');add(s,'l',[I(65,0,z),I(74,8,z)],'hl')});
  s=step('B','<b>الشكل النهائي:</b> نخفّت خطوط الإنشاء ونظهر الأسطح: فوق فاتح، أمام متوسط، يسار غامق.',4200);
  faces(s,[
   [[[0,8,0],[0,27,0],[0,27,12],[0,8,12]],'fl'],[[[0,8,0],[9,0,0],[9,0,12],[0,8,12]],'fa'],
   [[[9,0,0],[65,0,0],[65,0,12],[55,0,12],[55,0,26],[19,0,26],[19,0,12],[9,0,12]],'fa'],
   [[[19,0,12],[19,27,12],[19,27,26],[19,0,26]],'fl'],[[[45,16,0],[45,27,0],[45,27,26],[45,16,26]],'fl'],
   [[[0,8,12],[9,0,12],[19,0,12],[19,27,12],[0,27,12]],'ft'],[[[55,0,12],[65,0,12],[74,8,12],[74,27,12],[55,27,12]],'ft'],
   [[[19,0,26],[55,0,26],[55,27,26],[45,27,26],[45,16,26],[29,16,26],[29,27,26],[19,27,26]],'ft']]);
  s=step('B','<b>المقارنة:</b> الأمامي = طول × ارتفاع، الأفقي = طول × عمق، الجانبي = عمق × ارتفاع، والإيزومتريك بيجمعهم في صورة واحدة. 🔥',3200);
  add(s,'t',[[300,40]],'','المسألة 1 ✔');
}

/* ===== المسألة 2 =====
   قطاع أمامي: (0,0) (62,0) (62,12) (43,26) (19,26) (0,12) ممتد عمق 28
   فتحتين: x0..8 و x54..62 ، y10..18 ، نازلين بكل الارتفاع */
function problem2(){
  E=[];ST=[];K=4.5;
  const W=62,YD=28,H=26,xs=40+S*W+120,zq=12+14*8/19;
  const F=(x,z)=>[40+S*x,200-S*z],T=(x,y)=>[40+S*x,250+S*(YD-y)],D=(y,z)=>[xs+S*(YD-y),200-S*z];
  let s=step('A','<b>المعطى:</b> المسقط الأمامي (فوق) والأفقي (تحت). المطلوب المسقط <b>الجانبي من اليسار</b>. الخطين المتقطعين في الأمامي هم عمق الفتحتين الجانبيتين.',3200);
  add(s,'p',[F(0,0),F(62,0),F(62,12),F(43,26),F(19,26),F(0,12)],'given');
  add(s,'l',[F(8,0),F(8,zq)],'hid');add(s,'l',[F(54,0),F(54,zq)],'hid');
  add(s,'p',[T(0,0),T(62,0),T(62,10),T(54,10),T(54,18),T(62,18),T(62,28),T(0,28),T(0,18),T(8,18),T(8,10),T(0,10)],'given');
  add(s,'l',[T(19,0),T(19,28)],'given');add(s,'l',[T(43,0),T(43,28)],'given');
  add(s,'t',[[40,218]],'','الأمامي');add(s,'t',[[40,380]],'','الأفقي');add(s,'t',[[xs,218]],'','الجانبي (المطلوب)');
  common({F,T,W,YD,H,zs:[0,12,zq,26],ys:[0,10,18,28],xs});

/* ===== بناء الصفحة للمسألة ===== */
function build(n){
  if(n>NP)n=1;curN=n;K=4.5;({2:problem2,3:problem3,4:problem4,5:problem5,6:problem6}[n]||problem1)();
  refine();
  let c=0;ST.forEach(s=>{s.d*=1.5;s.start=c;c+=s.d});total=c;
  const cnt={},idx={};E.forEach(e=>{cnt[e.st]=(cnt[e.st]||0)+1});
  svgs.A.innerHTML='';svgs.B.innerHTML='';drawEl=null;lastIdx=-1;lastVis='';
  E.forEach(e=>{
    e.i=idx[e.st]=(idx[e.st]==null?0:idx[e.st]+1);e.n=cnt[e.st];e.k=null;e.mp=null;
    const tgt=svgs[ST[e.st].v];let n;
    if(e.type==='t'){n=document.createElementNS(NSv,'text');n.setAttribute('x',e.pts[0][0]);n.setAttribute('y',e.pts[0][1]);if(e.cls)n.setAttribute('class',e.cls);if(e.cls==='dimlbl')n.setAttribute('text-anchor','middle');n.textContent=e.txt;n.style.opacity=0}
    else if(e.type==='d'){n=document.createElementNS(NSv,'circle');n.setAttribute('cx',e.pts[0][0]);n.setAttribute('cy',e.pts[0][1]);n.setAttribute('r',0);n.setAttribute('class',e.cls)}
    else{
      const d='M'+e.pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+(e.type==='p'?'Z':'');
      n=document.createElementNS(NSv,'path');n.setAttribute('d',d);n.setAttribute('class',e.cls);
      if(/^(proj|mit|con|con2|hid)$/.test(e.cls)){
        const id='m'+(mk++),m=document.createElementNS(NSv,'mask'),mp=document.createElementNS(NSv,'path');
        m.setAttribute('id',id);m.setAttribute('maskUnits','userSpaceOnUse');m.setAttribute('x',0);m.setAttribute('y',0);m.setAttribute('width',720);m.setAttribute('height',520);
        mp.setAttribute('d',d);mp.setAttribute('pathLength',1);mp.setAttribute('fill','none');mp.setAttribute('stroke','#fff');mp.setAttribute('stroke-width',10);mp.style.strokeDasharray=1;mp.style.strokeDashoffset=1;
        m.appendChild(mp);tgt.appendChild(m);n.setAttribute('mask','url(#'+id+')');n.style.strokeDasharray='0.1 6';n.style.strokeLinecap='round';n.style.strokeWidth=e.cls==='mit'?3.4:2.6;e.mp=mp}
      else{n.setAttribute('pathLength',1);n.style.strokeDasharray=1;n.style.strokeDashoffset=1;n.style.fillOpacity=0}}
    e.el=n;tgt.appendChild(n)});
  ['A','B'].forEach(k=>{const p=document.createElementNS(NSv,'circle');p.setAttribute('r',6);p.setAttribute('class','pen');p.style.opacity=0;svgs[k].appendChild(p);pens[k]=p});
  buildMarks();buildSheet();
}
function buildMarks(){const m=$('marks');m.innerHTML='';ST.forEach(s=>{const d=document.createElement('i');d.style.insetInlineStart=(s.start/total*100)+'%';d.className='m'+s.v;m.appendChild(d)})}
function buildSheet(){const box=$('sheetList');box.innerHTML='';let ph='';
  ST.forEach((s,i)=>{if(s.v!==ph){ph=s.v;const h=document.createElement('div');h.className='sh-h';h.textContent=ph==='A'?'المرحلة الأولى — المسقط الثالث':'المرحلة الثانية — الإيزومتريك';box.appendChild(h)}
    const b=document.createElement('button');b.className='sh-i';b.innerHTML='<i>'+(i+1)+'</i><span>'+(ttlOf(s.txt)||'خطوة')+'</span>';
    b.onclick=()=>{t=end(i);playing=false;all=false;$('sheet').classList.remove('open');syncAll()};box.appendChild(b)})}
function buildChips(){const c=$('chips');c.innerHTML='';
  for(let n=1;n<=NP;n++){const b=document.createElement('button');b.className='chip'+(n===curN?' on':'');b.innerHTML='<b>'+n+'</b><span>مسألة</span>';b.onclick=()=>go(n);c.appendChild(b)}}
function go(n){playing=false;all=false;t=0;tabP='A';build(n);buildChips();try{localStorage.setItem('pn',n)}catch(e){}syncAll()}

/* ===== العرض ===== */
function curIdx(){const i=ST.findIndex(s=>t<=s.start+s.d);return i<0?ST.length-1:i}
function render(){
  const ci=curIdx(),ei=all?(tabP==='A'?lastA:ST.length-1):ci;let pen=null;
  E.forEach(e=>{
    const s=ST[e.st];let p;
    if(all||t>=s.start+s.d)p=1;else if(t<=s.start)p=0;else p=clamp(((t-s.start)/s.d)*e.n-e.i);
    e.p=p;
    const dm=ei>=e.dim,gn=e.gone!=null&&(all||ei>=e.gone);
    if(p>0&&p<1&&(e.type==='l'||e.type==='p'))pen=e;
    const key=p+(dm?'d':'')+(gn?'g':'');
    if(e.k===key)return;e.k=key;
    const el=e.el;
    if(e.type==='t')el.style.opacity=gn?0:(dm?0.2*p:p);
    else if(e.type==='d'){el.setAttribute('r',5*p);el.style.opacity=dm?0.2:1}
    else{if(e.mp)e.mp.style.strokeDashoffset=1-p;else{el.style.strokeDashoffset=1-p;el.style.fillOpacity=p}el.style.opacity=dm?0.2:1}});
  if(drawEl&&drawEl!==pen)drawEl.el.classList.remove('drawing');
  if(pen&&drawEl!==pen)pen.el.classList.add('drawing');
  drawEl=pen;
  const vis=all?tabP:ST[ci].v;
  svgs.A.style.display=vis==='A'?'block':'none';svgs.B.style.display=vis==='B'?'block':'none';
  pens.A.style.opacity=0;pens.B.style.opacity=0;
  if(pen&&!all&&ST[pen.st].v===vis){try{const L=pen.el.getTotalLength(),pt=pen.el.getPointAtLength(L*pen.p),pe=pens[vis];pe.setAttribute('cx',pt.x);pe.setAttribute('cy',pt.y);pe.style.opacity=1}catch(x){}}
  if(vis!==lastVis){lastVis=vis;[].forEach.call(document.querySelectorAll('#seg button'),b=>b.classList.toggle('on',b.dataset.p===vis))}
  if(ci!==lastIdx){const prev=lastIdx;lastIdx=ci;updateCard(ci);if(prev>=0&&ci!==prev){const host=$('presDrawing');host.classList.remove('step-change');void host.offsetWidth;host.classList.add('step-change');if(soundOn)playStepTone()}}
  const pct=Math.round(t/total*1000),sl=$('sl');sl.value=pct;sl.style.setProperty('--pr',(t/total*100)+'%');
  const ps=$('presScrub');if(ps){ps.style.setProperty('--pr',(t/total*100)+'%');if(document.activeElement!==ps)ps.value=pct}
}
function updateCard(ci){const s=ST[ci],T0=ttlOf(s.txt);
  $('stepNo').textContent='خطوة '+(ci+1)+' من '+ST.length;
  $('phaseTag').textContent=s.v==='A'?'المسقط الثالث':'الإيزومتريك';$('phaseTag').className='phase p'+s.v;
  $('ttl').textContent=T0||'خطوة';$('body').innerHTML=bodyOf(s.txt);
  $('sub').innerHTML=s.sub?'<span>تفصيل ومقاسات</span>'+s.sub:'';$('sub').style.display=s.sub?'block':'none';
  $('ctx').innerHTML=s.ctx?'<span>الهدف من الخطوة</span>'+s.ctx:'';$('ctx').style.display=s.ctx?'block':'none';
  $('presStep').innerHTML='مسألة <bdi dir="ltr">'+curN+'</bdi> · خطوة <bdi dir="ltr">'+(ci+1)+' / '+ST.length+'</bdi>';
  $('presPhase').textContent=s.v==='A'?'المسقط الثالث':'الإيزومتريك';$('presPhase').className='phase p'+s.v;
  $('presTitle').textContent=T0||'خطوة';$('presCounter').textContent=(ci+1)+' / '+ST.length;
  $('presProgress').style.width=(t/total*100)+'%';
  [].forEach.call(document.querySelectorAll('.sh-i'),(b,j)=>b.classList.toggle('on',j===ci))}
function syncAll(){
  $('play').innerHTML=SV(playing?IC.pause:IC.play,22)+'<span>'+(playing?'إيقاف مؤقت':(t>0&&t<total?'استكمال':'تشغيل'))+'</span>';$('play').classList.toggle('on',playing);
  $('solBtn').classList.toggle('on',all);$('solBtn').textContent=all?'إخفاء الحل':'الحل النهائي';
  $('pauseEach').classList.toggle('on',pauseEach);
  $('presPlay').innerHTML=SV(playing?IC.pause:IC.play,19)+'<span>'+(playing?'إيقاف':'تشغيل')+'</span>';$('presPlay').classList.toggle('on',playing);
  const soundIcon=SV(soundOn?IC.sound:IC.mute,19);[$('soundBtn'),$('presSound')].forEach(b=>{b.innerHTML=soundIcon;b.setAttribute('aria-pressed',String(soundOn));b.setAttribute('aria-label',soundOn?'كتم المؤثرات الصوتية':'تشغيل المؤثرات الصوتية')});}
function loop(ts){
  if(playing){let nt=t+Math.min(ts-last,80)*sp;
    if(pauseEach){const e=end(curIdx());if(t<e-0.5&&nt>=e){nt=e;playing=false;syncAll()}}
    if(nt>=total){nt=total;playing=false;syncAll()}
    t=nt}
  last=ts;render();requestAnimationFrame(loop)}

/* ===== التحكم ===== */
$('bp').innerHTML=SV(IC.prev);$('bn').innerHTML=SV(IC.next);$('rs').innerHTML=SV(IC.rs);$('zoomBtn').innerHTML=SV(IC.zoom,18);$('presentBtn').innerHTML=SV(IC.expand,19);$('presPrev').innerHTML=SV(IC.prev,18);$('presNext').innerHTML=SV(IC.next,18);
$('play').onclick=()=>{if(playing)playing=false;else{if(t>=total)t=0;all=false;playing=true}syncAll()};
$('rs').onclick=()=>{t=0;all=false;tabP='A';playing=true;syncAll()};
$('sl').oninput=e=>{t=e.target.value/1000*total;playing=false;all=false;syncAll()};
function nextStep(){playing=false;all=false;const i=curIdx();t=(t<end(i)-1)?end(i):end(Math.min(i+1,ST.length-1));syncAll()}
function prevStep(){playing=false;all=false;const i=curIdx();t=i>0?end(i-1):0;syncAll()}
$('bn').onclick=nextStep;$('bp').onclick=prevStep;
[['بطيء',0.5],['متوسط',0.8],['سريع',1.5]].forEach(a=>{const b=document.createElement('button');b.textContent=a[0];if(a[1]===sp)b.className='on';b.onclick=()=>{sp=a[1];[].forEach.call(document.querySelectorAll('#spd button'),x=>x.classList.remove('on'));b.classList.add('on')};$('spd').appendChild(b)});
$('solBtn').onclick=()=>{all=!all;playing=false;if(all)tabP=ST[curIdx()].v;syncAll()};
$('pauseEach').onclick=()=>{pauseEach=!pauseEach;syncAll()};
$('zoomBtn').onclick=()=>{zi=(zi+1)%ZS.length;$('canvas').style.setProperty('--z',ZS[zi])};
$('stepsBtn').onclick=()=>$('sheet').classList.add('open');
function ensureAudio(){if(!soundOn)return null;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;try{if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function playStepTone(){const c=ensureAudio();if(!c)return;try{const o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.type='sine';o.frequency.setValueAtTime(660,n);o.frequency.exponentialRampToValueAtTime(880,n+.07);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.026,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+.14);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+.15)}catch(e){}}
function toggleSound(){soundOn=!soundOn;if(soundOn){ensureAudio();playStepTone()}syncAll()}
function moveDrawingToPresentation(show){const host=$('presDrawing'),canvas=$('canvas');if(show){if(svgs.A.parentNode!==host)host.appendChild(svgs.A);if(svgs.B.parentNode!==host)host.appendChild(svgs.B)}else{if(svgs.A.parentNode!==canvas)canvas.appendChild(svgs.A);if(svgs.B.parentNode!==canvas)canvas.appendChild(svgs.B)}}
function openPresentation(){const modal=$('presentation');if(t>=total)t=0;all=false;moveDrawingToPresentation(true);modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('presentation-active');if(!playing)playing=true;ensureAudio();syncAll();render();try{if(modal.requestFullscreen)modal.requestFullscreen().catch(()=>{})}catch(e){}$('presClose').focus()}
function closePresentation(){const modal=$('presentation');playing=false;moveDrawingToPresentation(false);modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('presentation-active');if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}syncAll();$('presentBtn').focus()}
$('presentBtn').onclick=openPresentation;$('presClose').onclick=closePresentation;$('presPlay').onclick=()=>{$('play').onclick()};
function presentMove(dir){playing=false;all=false;const i=curIdx();if(dir>0)t=i>=ST.length-1?total:end(Math.min(i+1,ST.length-1));else t=i>0?end(i-1):0;syncAll();render()}
$('presPrev').onclick=()=>presentMove(-1);$('presNext').onclick=()=>presentMove(1);
$('presSound').onclick=toggleSound;$('soundBtn').onclick=toggleSound;
$('presScrub').oninput=e=>{t=e.target.value/1000*total;playing=false;all=false;syncAll();render()};
document.addEventListener('pointerdown',()=>{if(soundOn)ensureAudio()},{once:true,passive:true});
$('presentation').onclick=e=>{if(e.target===$('presentation'))closePresentation()};
$('shClose').onclick=()=>$('sheet').classList.remove('open');
$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').classList.remove('open')};
[].forEach.call(document.querySelectorAll('#seg button'),b=>{b.onclick=()=>{const p=b.dataset.p;if(all){tabP=p}else{playing=false;t=p==='A'?0:end(lastA)+1}syncAll()}});
function setTheme(m){document.documentElement.setAttribute('data-theme',m);try{localStorage.setItem('th',m)}catch(e){}$('themeBtn').innerHTML=SV(m==='dark'?IC.sun:IC.moon,20)}
$('themeBtn').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
let sx=null;$('canvas').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('canvas').addEventListener('touchend',e=>{if(sx==null||zi>0)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>90){if(dx<0)nextStep();else prevStep()}},{passive:true});
document.addEventListener('keydown',e=>{const inCinema=$('presentation').classList.contains('open');if(e.key==='Escape'&&inCinema){closePresentation();return}if(e.code==='Space'){e.preventDefault();if(inCinema)$('presPlay').onclick();else $('play').onclick()}else if(e.code==='ArrowLeft'){if(inCinema)presentMove(-1);else nextStep()}else if(e.code==='ArrowRight'){if(inCinema)presentMove(1);else prevStep()}});
for(let i=0;i<20;i++){const s=document.createElement('i');s.style.left=(Math.random()*100)+'%';s.style.animationDuration=(5+Math.random()*7)+'s';s.style.animationDelay=(-Math.random()*10)+'s';$('em').appendChild(s)}
let th0='dark',pn0=1;try{th0=localStorage.getItem('th')||'dark';pn0=parseInt(localStorage.getItem('pn'),10)||1}catch(e){}
setTheme(th0);go(pn0);requestAnimationFrame(loop);

</script>
